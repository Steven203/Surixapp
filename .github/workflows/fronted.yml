name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'surix-frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'surix-frontend/**'

jobs:
  build:
    name: Build y Lint Next.js
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: surix-frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: ./surix-frontend
        run: npm ci

      - name: Lint
        working-directory: ./surix-frontend
        run: npm run lint

      - name: Build
        working-directory: ./surix-frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080